version: "3.9"

services:
  backend:
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /app/Images:rw,nosuid,nodev,noexec,mode=1777
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "5001:5001"
    environment:
      RUNSOC_PROFILE: "prod"
      HOME: "/tmp"
      LOG_DIR: "/tmp/runsoc-logs"
      MPLCONFIGDIR: "/tmp/matplotlib"
      RATE_LIMIT_REQUESTS: "120"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      MAX_TASKS_PER_REQUEST: "200"
      MAX_RUNNING_REQUESTS_PER_IP: "2"

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_FRONTEND_ORIGIN: "http://localhost:3000"
        NEXT_PUBLIC_BACKEND_URL: "http://backend:5001/"
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "http://backend:5001/api/schedule"
      NEXT_PUBLIC_FRONTEND_ORIGIN: "http://localhost:3000"
      NEXT_PUBLIC_BACKEND_URL: "http://backend:5001/"
    depends_on:
      - backend
